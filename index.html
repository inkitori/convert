<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private, browser-based image, audio, and video converter."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:," />
    <title>Convert</title>
  </head>
  <body>
    <main>
      <h1>Convert</h1>

      <section class="converter" aria-label="File converter">
        <input id="file-input" class="visually-hidden" type="file" multiple />
        <button id="drop-zone" class="drop-zone" type="button">
          Choose files or drop them here
        </button>

        <div id="workspace" class="workspace" hidden>
          <div class="toolbar">
            <label>
              <span>Convert to</span>
              <select id="format-select" aria-label="Output format"></select>
            </label>
            <label>
              <span>Quality</span>
              <select id="quality-select" aria-label="Output quality">
                <option value="small">Smaller file</option>
                <option value="balanced" selected>Balanced</option>
                <option value="high">High quality</option>
              </select>
            </label>
            <button id="add-files" class="button button-secondary" type="button">
              Add
            </button>
          </div>

          <div class="queue-heading">
            <span id="queue-summary">0 files</span>
            <button id="clear-button" class="text-button" type="button">Clear</button>
          </div>
          <ul id="file-list" class="file-list" aria-label="Selected files"></ul>

          <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
          <div id="progress-status" class="visually-hidden" aria-live="polite"></div>

          <div class="actions">
            <button id="convert-button" class="button button-primary" type="button">
              Convert
            </button>
            <button id="cancel-button" class="button button-danger" type="button" hidden>
              Cancel
            </button>
            <button id="zip-button" class="button button-secondary" type="button" hidden>
              Download ZIP
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
